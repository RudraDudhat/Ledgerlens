<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
  <title>Settlement Statement</title>
  <style>
    /* A4 with a footer in the bottom margin, so it repeats on every page without being laid out
       into the flow. DejaVu Sans is registered by the renderer: the PDF base-14 fonts have no
       rupee sign and would drop it silently. */
    @page {
      size: A4;
      margin: 16mm 14mm 18mm 14mm;
      @bottom-left {
        /* A literal middot: a "\00b7" escape would eat the space that terminates it. */
        content: "Generated by Ledgerlens · numbers computed from your files; AI wrote only the plain-words section.";
        font-family: "DejaVu Sans", sans-serif;
        font-size: 7pt;
        color: #666666;
      }
      @bottom-right {
        content: "Page " counter(page) " of " counter(pages);
        font-family: "DejaVu Sans", sans-serif;
        font-size: 7pt;
        color: #666666;
      }
    }

    body {
      font-family: "DejaVu Sans", sans-serif;
      font-size: 9pt;
      line-height: 1.45;
      color: #111111;
      margin: 0;
    }

    h1 { font-size: 15pt; margin: 0; }
    h2 {
      font-size: 9.5pt;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #444444;
      margin: 22pt 0 7pt 0;
      border-bottom: 0.5pt solid #cccccc;
      padding-bottom: 2pt;
    }

    .masthead { border-bottom: 1pt solid #111111; padding-bottom: 10pt; }
    .merchant { font-size: 11pt; font-weight: bold; }
    .meta { font-size: 8pt; color: #555555; margin-top: 2pt; }
    .batch { font-size: 7pt; color: #999999; margin-top: 1pt; }

    /* The whole statement in one sentence, sized so it is the first thing read. */
    .headline {
      font-size: 12.5pt;
      line-height: 1.5;
      margin: 20pt 0 4pt 0;
    }

    table.waterfall { width: 100%; border-collapse: collapse; margin-top: 6pt; }
    table.waterfall th {
      font-size: 7.5pt;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #666666;
      text-align: left;
      font-weight: normal;
      padding: 0 4pt 3pt 0;
      border-bottom: 0.5pt solid #cccccc;
    }
    table.waterfall td {
      padding: 5.5pt 4pt 5.5pt 0;
      border-bottom: 0.5pt solid #eeeeee;
      vertical-align: middle;
    }
    .col-amount { text-align: right; width: 22%; white-space: nowrap; }
    .col-share { text-align: right; width: 13%; white-space: nowrap; }
    .col-bar { width: 26%; }

    /* Greyscale on purpose: the row label says what the number is, so nothing depends on colour. */
    .bar-track { background: #eeeeee; height: 7pt; width: 100%; }
    .bar-fill { background: #555555; height: 7pt; }
    .bar-fill-open { background: #aaaaaa; height: 7pt; }

    tr.total td {
      font-weight: bold;
      font-size: 10pt;
      border-top: 1pt solid #111111;
      border-bottom: none;
      padding-top: 5pt;
    }
    .note { font-size: 8pt; color: #555555; margin-top: 8pt; }

    p.plain { margin: 0; line-height: 1.65; }

    /* Amounts inside the prose, set to match the table above: the same rupee figure should look the
       same in both halves of the page, and be findable without reading the sentence around it. */
    .figure { font-weight: bold; white-space: nowrap; }

    .group { margin-top: 14pt; }
    .group-head { font-weight: bold; font-size: 9pt; margin-bottom: 1pt; }
    .group-why { font-size: 8.5pt; color: #444444; line-height: 1.5; margin: 2pt 0 5pt 0; }
    table.rows { width: 100%; border-collapse: collapse; }
    table.rows td {
      padding: 3.5pt 4pt 3.5pt 0;
      font-size: 8pt;
      line-height: 1.5;
      border-bottom: 0.5pt solid #f2f2f2;
      vertical-align: top;
    }
    .ref { width: 22%; }
    .amt { width: 14%; text-align: right; white-space: nowrap; }
    .when { width: 16%; white-space: nowrap; color: #555555; }
    .why { color: #333333; }
    .more { font-size: 8pt; color: #555555; margin-top: 8pt; }

    /* The money story ends at the plain-words paragraph. The exception list is reference material
       for whoever is chasing it, so it takes its own page instead of trailing off the first one and
       splitting the answer across a fold. The row cap keeps it to that one page. */
    .new-page { page-break-before: always; }
    .new-page h2 { margin-top: 0; }

    ul.alerts { margin: 0; padding-left: 12pt; }
    ul.alerts li { margin-bottom: 3pt; }
    .cause { color: #444444; }
    .empty { font-size: 8.5pt; color: #555555; margin: 0; }
  </style>
</head>
<body>

<div class="masthead">
  <div class="merchant">{{merchant}}</div>
  <h1>Settlement Statement</h1>
  <div class="meta">{{period}} &#183; generated {{generatedAt}}</div>
  <div class="batch">Statement reference {{reference}}</div>
</div>

<p class="headline">{{headline}}</p>

<h2>Where the money went</h2>
<table class="waterfall">
  <thead>
    <tr>
      <th>What</th>
      <th class="col-amount">Amount</th>
      <th class="col-share">Share of sales</th>
      <th class="col-bar"></th>
    </tr>
  </thead>
  <tbody>
{{waterfallRows}}
  </tbody>
</table>
<p class="note">{{reconcileNote}}</p>

<h2>In plain words</h2>
{{plainWords}}

<div class="new-page">
  <h2>What needs your attention</h2>
  {{attention}}
</div>

{{changes}}

</body>
</html>
