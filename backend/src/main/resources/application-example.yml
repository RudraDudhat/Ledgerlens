# Copy this file to application.yml (application.yml is gitignored) and adjust if you need to.
# No credentials live here: every value below is read from the environment, and the defaults are
# local-development conveniences only. Real secrets belong in .env, which is gitignored.
spring:
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:ledgerlens}
    username: ${POSTGRES_USER:ledgerlens}
    password: ${POSTGRES_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  sql:
    init:
      mode: always
  ai:
    google:
      genai:
        # Without GEMINI_API_KEY the chat model is simply absent: reconciliation, the waterfall and
        # the metrics all still work, and only the three AI endpoints refuse.
        api-key: ${GEMINI_API_KEY:unset}
        embedding:
          # Its own key, deliberately: the embedding connection reads this prefix and not the chat
          # one above, so omitting it leaves the app with no embedding model and fuzzy Ask search
          # that silently finds nothing.
          api-key: ${GEMINI_API_KEY:unset}
          text:
            options:
              model: ${GEMINI_EMBEDDING_MODEL:gemini-embedding-001}
        chat:
          options:
            model: ${GEMINI_MODEL:gemini-3.6-flash}
            temperature: 0.0

ledgerlens:
  # Hybrid Ask retrieval. Off means the Ask panel behaves exactly as it did before vectors
  # existed: exact lookups only, and nothing is indexed at the end of reconcile.
  rag:
    enabled: ${LEDGERLENS_RAG_ENABLED:true}
    # One embedding request per document. Gemini's free tier allows a hundred a minute, so the
    # default keeps a whole reconcile inside it; exceptions are indexed first and matches fill
    # whatever is left. Raise it on a paid key.
    max-documents: ${LEDGERLENS_RAG_MAX_DOCUMENTS:90}
  # Ground truth for /api/metrics/{batchId}. Scores are omitted when this file is absent,
  # which is the normal case for a real merchant batch.
  answer-key-path: ${LEDGERLENS_ANSWER_KEY_PATH:data/answer_key.json}
  # Printed at the head of the settlement statement. There is no merchant record in the
  # schema, so the name the PDF is addressed to is configuration rather than data.
  merchant-name: ${LEDGERLENS_MERCHANT_NAME:Your business}
