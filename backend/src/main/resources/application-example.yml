# Copy this file to application.yml (application.yml is gitignored) and adjust if you need to.
# No credentials live here: every value below is read from the environment, and the defaults are
# local-development conveniences only. Real secrets belong in .env, which is gitignored.
spring:
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:ledgerlens}
    username: ${POSTGRES_USER:ledgerlens}
    password: ${POSTGRES_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  sql:
    init:
      mode: always
  ai:
    google:
      genai:
        # Without GEMINI_API_KEY the chat model is simply absent: reconciliation, the waterfall and
        # the metrics all still work, and only the three AI endpoints refuse.
        api-key: ${GEMINI_API_KEY:unset}
        chat:
          options:
            model: ${GEMINI_MODEL:gemini-2.5-flash}
            temperature: 0.0

ledgerlens:
  # Ground truth for /api/metrics/{batchId}. Scores are omitted when this file is absent,
  # which is the normal case for a real merchant batch.
  answer-key-path: ${LEDGERLENS_ANSWER_KEY_PATH:data/answer_key.json}
