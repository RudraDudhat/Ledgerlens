services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ledgerlens
      POSTGRES_USER: ledgerlens
      POSTGRES_PASSWORD: ledgerlens
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledgerlens -d ledgerlens"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ledgerlens
      SPRING_DATASOURCE_USERNAME: ledgerlens
      SPRING_DATASOURCE_PASSWORD: ledgerlens
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
    ports:
      - "8080:8080"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "5173:5173"

volumes:
  pgdata:
